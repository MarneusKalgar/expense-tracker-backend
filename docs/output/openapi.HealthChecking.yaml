openapi: 3.1.0
info:
  title: Health
  version: 0.0.0
tags:
  - name: Health
paths:
  /health:
    get:
      operationId: healthCheck
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheck"
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
      tags:
        - Health
  /live:
    get:
      operationId: livenessCheck
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessCheck"
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
      tags:
        - Health
  /ready:
    get:
      operationId: readinessCheck
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessCheck"
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
      tags:
        - Health
components:
  schemas:
    Error:
      type: string
      enum:
        - connected
        - disconnected
        - unknown
    HealthCheck:
      type: object
      required:
        - services
        - status
        - timestamp
        - uptime
      properties:
        services:
          $ref: "#/components/schemas/Service"
        status:
          $ref: "#/components/schemas/Status"
        timestamp:
          type: string
        uptime:
          type: integer
          format: int32
    InternalServerError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INTERNAL_SERVER_ERROR
        message:
          type: string
          enum:
            - Service Unavailable
    LivenessCheck:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: string
    ReadinessCheck:
      type: object
      required:
        - services
        - status
      properties:
        services:
          $ref: "#/components/schemas/Service"
        status:
          $ref: "#/components/schemas/Status"
    Service:
      type: object
      required:
        - database
        - redis
      properties:
        database:
          $ref: "#/components/schemas/Error"
        redis:
          $ref: "#/components/schemas/Error"
    Status:
      type: string
      enum:
        - degraded
        - down
        - ok
